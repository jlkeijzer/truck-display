<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Truck Display</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Truck">
<meta name="theme-color" content="#0b0c0b">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: #0b0c0b; color: #fff; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif; }
  body { position: fixed; inset: 0; -webkit-user-select: none; user-select: none; }

  /* ---------- background ---------- */
  #bg { position: fixed; inset: -8%; background: #0b0c0b url("topo.webp") center / cover no-repeat;
    animation: drift 90s ease-in-out infinite alternate; will-change: transform; }
  @keyframes drift {
    0%   { transform: scale(1.12) translate3d(-2.5%, -1.5%, 0); }
    100% { transform: scale(1.22) translate3d(2.5%, 1.5%, 0); }
  }
  #shade { position: fixed; inset: 0;
    background: radial-gradient(ellipse at 70% 50%, rgba(8,9,8,.35), rgba(8,9,8,.78) 85%);
  }

  /* ---------- main layout ---------- */
  #app { position: fixed; inset: 0; display: none; padding: max(4vh, env(safe-area-inset-top)) 5vw max(4vh, env(safe-area-inset-bottom)) 5vw;
    grid-template-columns: 44% 1fr; grid-template-rows: 1fr auto; column-gap: 5vw; row-gap: 2.5vh; }
  body.ready #app { display: grid; }

  #left { display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 3vh; min-width: 0; min-height: 0; }
  #deck { position: relative; width: min(100%, 62vh); aspect-ratio: 1; flex-shrink: 0; }
  #rec { position: absolute; inset: 0; border-radius: 50%;
    background: repeating-radial-gradient(circle at center, #121312 0 1.5px, #1c1d1c 1.5px 3px);
    box-shadow: 0 2vh 6vh rgba(0,0,0,.65), inset 0 0 0 .4vh #0a0b0a;
    animation: spin 8s linear infinite; animation-play-state: paused; will-change: transform; }
  body.playing #rec { animation-play-state: running; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #deck { cursor: pointer; touch-action: manipulation; }
  #art { position: absolute; inset: 19%; border-radius: 50%; background: #1a1b1a center / cover no-repeat;
    box-shadow: 0 0 0 .5vh #0d0e0d; }
  #toast { position: fixed; left: 50%; bottom: 9vh; transform: translateX(-50%); background: rgba(20,21,20,.92);
    border: 1px solid rgba(255,255,255,.14); border-radius: 1.4vh; padding: 1.4vh 2.4vw; font-size: 2.2vh;
    opacity: 0; transition: opacity .3s; pointer-events: none; }
  #toast.show { opacity: 1; }
  #net { position: fixed; z-index: 5; left: 50%; top: max(1.5vh, env(safe-area-inset-top)); transform: translateX(-50%);
    font-size: 1.9vh; color: rgba(255,255,255,.6); opacity: 0; transition: opacity .4s; pointer-events: none; }
  body.ready.offline #net { opacity: 1; }
  #hole { position: absolute; left: 50%; top: 50%; width: 3.2%; aspect-ratio: 1; transform: translate(-50%, -50%);
    border-radius: 50%; background: #0b0c0b; box-shadow: 0 0 0 .3vh rgba(255,255,255,.15); }
  #sheen { position: absolute; inset: 0; border-radius: 50%; pointer-events: none;
    background: conic-gradient(from 20deg, transparent 0 8%, rgba(255,255,255,.07) 13%, transparent 19% 58%, rgba(255,255,255,.05) 63%, transparent 69%); }
  #right { display: flex; flex-direction: column; gap: 2.4vh; min-width: 0; min-height: 0; padding-top: 3vh; }
  #meta { min-width: 0; }
  #title { font-size: 3.6vh; font-weight: 700; line-height: 1.15; letter-spacing: -.01em;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  #artist { margin-top: .7vh; font-size: 2.6vh; color: rgba(255,255,255,.66); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #bars { display: flex; align-items: flex-end; gap: .55vh; height: 8vh; width: min(100%, 62vh); flex-shrink: 0; }
  #bars i { flex: 1; height: 100%; background: linear-gradient(to top, rgba(255,255,255,.95), rgba(255,255,255,.35));
    border-radius: .5vh; transform-origin: bottom; transform: scaleY(.05); will-change: transform; }

  #lyricsWrap { position: relative; flex: 1; min-height: 0; overflow: hidden;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 18%, #000 82%, transparent 100%);
            mask-image: linear-gradient(to bottom, transparent 0, #000 18%, #000 82%, transparent 100%); }
  #lyrics { position: absolute; left: 0; right: 0; top: 0; transition: transform .55s cubic-bezier(.22,.8,.3,1); will-change: transform; }
  .ln { font-size: 5.2vh; font-weight: 800; line-height: 1.18; letter-spacing: -.015em; padding: 1.1vh 0;
    color: rgba(255,255,255,.28); transform-origin: left center; transition: color .35s, transform .35s;
    transform: scale(.94); }
  .ln.on { color: #fff; transform: scale(1); }
  .ln.past { color: rgba(255,255,255,.2); }  #nolyrics { position: absolute; inset: 0; display: none; align-items: center; justify-content: flex-start;
    font-size: 3vh; color: rgba(255,255,255,.4); font-weight: 600; }
  body.nolyr #nolyrics { display: flex; }
  body.nolyr #lyrics { display: none; }

  /* ---------- bottom progress ---------- */
  #foot { grid-column: 1 / -1; display: flex; align-items: center; gap: 2vw; }
  .t { font-size: 2.2vh; color: rgba(255,255,255,.6); font-variant-numeric: tabular-nums; min-width: 6.5vh; }
  .t.r { text-align: right; }
  #track { flex: 1; height: .8vh; background: rgba(255,255,255,.16); border-radius: 1vh; overflow: hidden; }
  #fill { height: 100%; width: 0; background: #fff; border-radius: 1vh; }
  #nudge { display: flex; align-items: center; gap: 1vh; opacity: .35; }
  #nudge button { background: rgba(255,255,255,.12); color: #fff; border: 0; border-radius: 1vh;
    width: 5vh; height: 4.4vh; font-size: 2.4vh; font-weight: 700; }

  /* ---------- setup / status screens ---------- */
  #setup { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 5vh 6vw; }
  body.ready #setup { display: none; }
  .card { width: min(760px, 100%); background: rgba(14,15,14,.82); border: 1px solid rgba(255,255,255,.12);
    border-radius: 2vh; padding: 4vh 4vw; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  .card h1 { font-size: 3.6vh; margin-bottom: 1.4vh; }
  .card p { font-size: 2.2vh; line-height: 1.45; color: rgba(255,255,255,.72); margin-bottom: 2vh; }
  .card label { display: block; font-size: 1.9vh; color: rgba(255,255,255,.55); margin-bottom: .8vh; }
  .card input, .card code { width: 100%; display: block; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.16);
    color: #fff; border-radius: 1.2vh; padding: 1.6vh 1.6vw; font-size: 2.1vh; margin-bottom: 2.2vh; word-break: break-all;
    -webkit-user-select: text; user-select: text; font-family: ui-monospace, Menlo, monospace; }
  .card button { background: #fff; color: #000; border: 0; border-radius: 1.2vh; padding: 1.8vh 2.6vw; font-size: 2.3vh; font-weight: 700; }
  #err { color: #ff8a80; font-size: 2vh; margin-top: 1.6vh; min-height: 2.4vh; }

  /* ---------- layout 14: everything centered, stacked ---------- */
  #app { grid-template-columns: 1fr; grid-template-rows: auto 1fr auto; row-gap: 2vh; justify-items: center; }
  #left { gap: 2.2vh; }
  #app { grid-template-rows: auto 1fr auto auto; row-gap: 1.6vh; }
  #right { position: relative; }
  #foot { justify-self: center; width: min(94vw, 82vh); gap: 1.6vh; }
  #foot .t { min-width: 7.5vh; }
  /* small skip arrows right at the ends of the progress bar (the button is bigger than the arrow, easier to hit) */
  .skip { flex: none; width: 6.4vh; height: 6.4vh; margin: 0 -1.8vh; padding: 0; border: 0; background: none;
    display: flex; align-items: center; justify-content: center; opacity: .6; transition: opacity .2s, transform .12s; }
  .skip svg { width: 2.5vh; height: 2.5vh; fill: none; stroke: #fff; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .skip:active { opacity: 1; transform: scale(.85); }
  #meta { justify-self: center; }
  /* sync buttons: two album-colored circles, minus left of the record, plus right of it, level with its center */
  #left { position: relative; }
  #nudge { position: absolute; inset: 0; display: block; opacity: 1; pointer-events: none; }
  #nudge button { position: absolute; top: 22vh; transform: translateY(-50%); pointer-events: auto;
    width: 4.8vh; height: 4.8vh; border-radius: 50%; padding: 0; font-size: 2.8vh; font-weight: 800; line-height: 1;
    background: transparent; border: .28vh solid rgb(var(--acc)); color: rgb(var(--acc));
    opacity: .2; transition: opacity .8s, border-color 1s, color 1s, transform .12s; }
  body.nudgeOn #nudge button { opacity: 1; }
  #nudge button:active { transform: translateY(-50%) scale(.9); }
  #nm { right: calc(50% + 22vh + 5vh); }
  #np { left: calc(50% + 22vh + 5vh); }
  #deck { width: 44vh; }
  #bars { width: min(90vw, 64vh); height: 6.5vh; }
  #right { width: 100%; align-items: center; gap: 1vh; padding-top: 0; }
  #meta { order: 2; display: flex; justify-content: center; align-items: baseline; gap: 1.2vh; max-width: 90%; }
  #title { font-size: 2.4vh; -webkit-line-clamp: 1; }
  #artist { margin-top: 0; font-size: 2.4vh; }
  #artist::before { content: "·  "; }
  #lyricsWrap { width: 100%;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 30%, #000 70%, transparent 100%);
            mask-image: linear-gradient(to bottom, transparent 0, #000 30%, #000 70%, transparent 100%); }
  .ln { text-align: center; transform-origin: center center; font-size: 4.6vh; padding: .8vh 4vw; }
  #nolyrics { justify-content: center; }

  /* ---------- album colors: bars and progress take the cover's color ---------- */
  :root { --acc: 255,255,255; }
  #bars i { background: rgb(var(--acc)); transition: background-color 1s;
    -webkit-mask-image: linear-gradient(to top, #000, rgba(0,0,0,.4)); mask-image: linear-gradient(to top, #000, rgba(0,0,0,.4)); }
  #fill { background: rgb(var(--acc)); transition: background-color 1s; }

  /* ---------- pages: swipe left from the Music page to the Radar page ---------- */
  #app, #setup { transition: transform .45s cubic-bezier(.2,.8,.2,1); }
  body.onRadar #app, body.onRadar #setup { transform: translateX(-100%); }
  #radar { position: fixed; inset: 0; z-index: 10; background: #0b0c0b; transform: translateX(100%);
    transition: transform .45s cubic-bezier(.2,.8,.2,1); overflow: hidden; }
  body.onRadar #radar { transform: none; }
  #map { position: absolute; inset: 0; background: #0b0c0b; }
  #rain { position: absolute; inset: 0; pointer-events: none; filter: blur(5px); }   /* soft, smooth rain */
  #rain .maplibregl-canvas { background: transparent; }
  .maplibregl-ctrl-attrib { background: rgba(11,12,11,.55) !important; color: rgba(255,255,255,.4) !important; font-size: 1.2vh !important; }
  .maplibregl-ctrl-attrib a { color: rgba(255,255,255,.5) !important; }
  .maplibregl-ctrl-attrib-button { filter: invert(1); opacity: .5; }
  .maplibregl-ctrl-bottom-right { bottom: calc(max(2.6vh, env(safe-area-inset-bottom)) + 7.5vh); }
  .glass { position: absolute; z-index: 500; background: rgba(14,15,14,.62); border: 1px solid rgba(255,255,255,.1);
    border-radius: 2.2vh; -webkit-backdrop-filter: blur(18px) saturate(140%); backdrop-filter: blur(18px) saturate(140%);
    box-shadow: 0 1.5vh 4vh rgba(0,0,0,.45); }
  #wx { left: max(2.6vw, env(safe-area-inset-left)); top: max(2.6vh, env(safe-area-inset-top)); padding: 2.2vh 2.6vh; min-width: 34vh; }
  #clock { font-size: 9vh; font-weight: 200; letter-spacing: -.03em; line-height: .95; }
  #clock small { font-size: 3vh; font-weight: 300; margin-left: .6vh; color: rgba(255,255,255,.6); letter-spacing: 0; }
  #date { font-size: 2vh; color: rgba(255,255,255,.55); margin-top: .6vh; }
  #now { display: flex; align-items: center; gap: 1.6vh; margin-top: 2vh; padding-top: 1.8vh; border-top: 1px solid rgba(255,255,255,.1); }
  #now svg { width: 6vh; height: 6vh; flex: none; }
  #temp { font-size: 6vh; font-weight: 200; line-height: 1; }
  #cond { font-size: 2.1vh; }
  #hilo { font-size: 1.8vh; color: rgba(255,255,255,.55); margin-top: .3vh; }
  #details { display: grid; grid-template-columns: repeat(3, auto); gap: 1.6vh; margin-top: 1.8vh; font-size: 1.8vh; }
  #details div { color: rgba(255,255,255,.5); }
  #details b { display: block; color: #fff; font-weight: 500; font-size: 2.1vh; margin-top: .2vh; }
  #alerts { right: max(2.6vw, env(safe-area-inset-right)); top: max(2.6vh, env(safe-area-inset-top)); padding: 1.6vh 2.2vh;
    max-width: 40vw; display: flex; flex-direction: column; gap: 1vh; }
  .al { display: flex; align-items: center; gap: 1.2vh; font-size: 2vh; }
  .al i { width: 1.2vh; height: 1.2vh; border-radius: 50%; flex: none; background: #5dcaa5; }
  .al.rain i { background: #5aa9ff; box-shadow: 0 0 1.2vh #5aa9ff; }
  .al.warn { color: #ffb3a8; } .al.warn i { background: #ff5a4a; box-shadow: 0 0 1.2vh #ff5a4a; }
  #timeline { left: 50%; transform: translateX(-50%); bottom: max(2.6vh, env(safe-area-inset-bottom)); width: min(92vw, 150vh);
    padding: .9vh 2.6vh .9vh 1vh; display: flex; align-items: center; gap: 1.6vh; border-radius: 4vh; }
  #play { flex: none; width: 4.4vh; height: 4.4vh; border-radius: 50%; border: 0; background: rgba(255,255,255,.12); display: flex;
    align-items: center; justify-content: center; }
  #play svg { width: 2vh; height: 2vh; fill: #fff; }
  #play:active { transform: scale(.9); }
  /* the touch area stays tall enough for a finger; the bar you see is thin */
  #scrubWrap { position: relative; flex: 1; height: 4.4vh; touch-action: none; }
  #scrubTrack { position: absolute; left: 0; right: 0; top: 50%; height: .5vh; margin-top: -.25vh; border-radius: 1vh;
    background: linear-gradient(to right, rgba(255,255,255,.16) var(--nowPct), rgba(90,169,255,.35) var(--nowPct)); }
  #nowMark { position: absolute; top: 50%; width: .3vh; height: 1.6vh; margin: -.8vh 0 0 -.15vh; background: rgba(255,255,255,.7); border-radius: .3vh; }
  #knob { position: absolute; top: 50%; width: 2.2vh; height: 2.2vh; margin: -1.1vh 0 0 -1.1vh; border-radius: 50%; background: #fff;
    box-shadow: 0 .3vh 1vh rgba(0,0,0,.5); }
  #wx.past #clock, #wx.fut #clock { color: #9cc8ff; }
  #when { color: #9cc8ff; }
  #rbtns { right: max(2.6vw, env(safe-area-inset-right)); bottom: calc(max(2.6vh, env(safe-area-inset-bottom)) + 9vh);
    display: flex; flex-direction: column; overflow: hidden; }
  #rbtns button { width: 6.4vh; height: 6.4vh; border: 0; background: none; display: flex; align-items: center; justify-content: center; }
  #rbtns button + button { border-top: 1px solid rgba(255,255,255,.1); }
  #rbtns svg { width: 2.8vh; height: 2.8vh; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; }
  #recenter svg { stroke: #5aa9ff; }
  #toMusic { left: max(2.6vw, env(safe-area-inset-left)); bottom: calc(max(2.6vh, env(safe-area-inset-bottom)) + 9vh);
    width: 6.4vh; height: 6.4vh; border: 1px solid rgba(255,255,255,.1); display: flex; align-items: center; justify-content: center; }
  #toMusic svg { width: 3vh; height: 3vh; }
  #locNote { position: absolute; z-index: 500; left: 50%; transform: translateX(-50%); top: max(2.6vh, env(safe-area-inset-top));
    font-size: 1.7vh; color: rgba(255,255,255,.55); background: rgba(14,15,14,.6); padding: .6vh 1.4vh; border-radius: 1.4vh; display: none; }
  body.approxLoc #locNote { display: block; }
  .me { position: relative; }
  .me i { position: absolute; left: 50%; top: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%;
    background: #3b8bff; border: 3px solid #fff; box-shadow: 0 0 12px rgba(59,139,255,.9); }
  .me b { position: absolute; left: 50%; top: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%;
    background: rgba(59,139,255,.45); animation: ping 2.2s ease-out infinite; }
  @keyframes ping { from { transform: scale(1); opacity: .9; } to { transform: scale(4.5); opacity: 0; } }
</style>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.1/dist/maplibre-gl.css"
  integrity="sha384-uTttxo/aOKbdE5RlD/SPzSDoDmNvGlUYPjONi2MN/b7c9HPSvW07OIuyP7uL6jxK" crossorigin="anonymous">
</head>
<body>
<div id="bg"></div><div id="shade"></div><div id="toast"></div><div id="net">Waiting for internet…</div>

<div id="setup">
  <div class="card" id="setupCard">
    <h1>Connect Spotify</h1>
    <p id="setupText">Tap Connect Spotify to sign in.</p>
    <label for="cid">Client ID</label>
    <input id="cid" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="32 characters">
    <label>Redirect URI (paste this exact address in the Spotify dashboard)</label>
    <code id="ruri"></code>
    <button id="connect">Connect Spotify</button>
    <div id="err"></div>
  </div>
</div>

<div id="app">
  <div id="left">
    <div id="deck"><div id="rec"><div id="art"></div>
      <div id="hole"></div></div><div id="sheen"></div></div>
    <div id="bars"></div>
    <div id="nudge"><button id="nm" aria-label="Lyrics earlier">−</button><button id="np" aria-label="Lyrics later">+</button></div>
  </div>
  <div id="right">
    <div id="lyricsWrap">
      <div id="lyrics"></div>
      <div id="nolyrics">No synced lyrics for this song</div>
    </div>
  </div>
  <div id="foot">
    <div class="t" id="tc">0:00</div>
    <button class="skip" id="prev" aria-label="Previous song"><svg viewBox="0 0 10 10"><path d="M6.5 1.5 3 5l3.5 3.5"/></svg></button>
    <div id="track"><div id="fill"></div></div>
    <button class="skip" id="next" aria-label="Next song"><svg viewBox="0 0 10 10"><path d="M3.5 1.5 7 5 3.5 8.5"/></svg></button>
    <div class="t r" id="td">0:00</div>
  </div>
  <div id="meta"><div id="title">Nothing playing</div><div id="artist">&nbsp;</div></div>
</div>

<!-- Radar page: live rain map, time and weather. Nothing personal: the location stays on the iPad
     (only a rounded spot is sent to the free weather services to get the forecast). -->
<div id="radar">
  <div id="map"></div>
  <div id="rain"></div>
  <div class="glass" id="wx">
    <div id="clock">--:--</div>
    <div id="date">&nbsp;</div>
    <div id="now"><span id="wxIcon"></span><div><div id="temp">--°</div><div id="cond">Loading weather…</div><div id="hilo">&nbsp;</div></div></div>
    <div id="details"><div>Feels like<b id="feels">--</b></div><div>Wind<b id="wind">--</b></div><div>Humidity<b id="hum">--</b></div></div>
  </div>
  <div class="glass" id="alerts"><div class="al"><i></i><span>Checking for rain…</span></div></div>
  <div id="locNote">Approximate location</div>
  <div class="glass" id="rbtns">
    <button id="zin" aria-label="Zoom in"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <button id="zout" aria-label="Zoom out"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
    <button id="recenter" aria-label="Back to my location"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><circle cx="12" cy="12" r="8"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3"/></svg></button>
  </div>
  <button class="glass" id="toMusic" aria-label="Music page"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#1c1d1c" stroke="rgba(255,255,255,.5)" stroke-width="1"/><circle cx="12" cy="12" r="4" fill="#fff"/><circle cx="12" cy="12" r="1" fill="#0b0c0b"/></svg></button>
  <div class="glass" id="timeline">
    <button id="play" aria-label="Play the rain"><svg viewBox="0 0 24 24" id="playIco"><path d="M7 4.5v15l13-7.5z"/></svg></button>
    <div id="scrubWrap"><div id="scrubTrack"></div><div id="nowMark"></div><div id="knob"></div></div>
  </div>
</div>

<script>
(() => {
"use strict";

/* ---------- small helpers ---------- */
const $ = id => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return mem[k] || null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { mem[k] = v; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { delete mem[k]; } }
};
const mem = {};
const params = new URLSearchParams(location.search);
const DEMO = params.has("demo");const REDIRECT = location.origin + location.pathname;
/* Julian's Spotify app ("truck display"). A Client ID is not a password: it only starts a sign-in that
   comes back to this page. Saved here so it never has to be typed again. */
const CLIENT_ID = "d2d0cf5c9581497c8cdd623d9badb2ac";
const clientId = () => store.get("td_client") || CLIENT_ID;
const SCOPES ="user-read-currently-playing user-read-playback-state user-modify-playback-state";
const fmt = ms => { ms = Math.max(0, ms | 0); const s = Math.floor(ms / 1000); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };

/* ---------- auth (Spotify PKCE, no secret needed) ---------- */
const b64url = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const rand = n => { const a = new Uint8Array(n); crypto.getRandomValues(a); return b64url(a); };

  store.set("td_verifier", verifier);

/* "revoked" = Spotify really said no (sign in again). "offline" = no internet or a Spotify hiccup:

  } catch (e) { throw new Error("offline"); }
  if (r.status === 400 || r.status === 401) throw new Error("revoked");

  const j = await r.json();

  const t = { access: j.access_token, refresh: j.refresh_token || old.refresh, scope: j.scope || old.scope || "", exp: Date.now() + j.expires_in * 1000 };

    client_id: clientId(), code_verifier: store.get("td_verifier") });

let tok = null;

  if (!tok) return null;

    try { tok = await tokenRequest({ grant_type: "refresh_token", refresh_token: tok.refresh, client_id: clientId() }); }
    catch (e) { if (e.message === "revoked") return null; throw e; }   // offline: keep the sign-in, caller retries
  }

let busy = false;

  const want = !S.playing;

  if (DEMO) { go(); return; }
  try { await getToken(); } catch (e) { toast("No internet right now."); return; }
  if (!tok || !/user-modify-playback-state/.test(tok.scope || "")) {
    toast("One-time sign-in to turn on tap to pause…");
    setTimeout(() => startLogin(clientId()), 1500);
    return;
  }
  busy = true;
  const was = S.playing; go();
  try {
    let t = await getToken();
    const call = t => fetch("https://api.spotify.com/v1/me/player/" + (want ? "play" : "pause"), { method: "PUT", headers: { Authorization: "Bearer " + t } });
    let r = await call(t);
    if (r.status === 401) { t = await getToken(true); if (t) r = await call(t); }
    if (!r.ok) {

  finally { busy = false; }
}

/* ---------- Spotify now-playing ---------- */
async function fetchNow() {
  let t = await getToken();
  if (!t) throw new Error("auth");
  let r = await fetch("https://api.spotify.com/v1/me/player/currently-playing?additional_types=episode", { headers: { Authorization: "Bearer " + t } });
  if (r.status === 401) { t = await getToken(true); if (!t) throw new Error("auth");
    r = await fetch("https://api.spotify.com/v1/me/player/currently-playing?additional_types=episode", { headers: { Authorization: "Bearer " + t } }); }
  if (r.status === 204) return null;
  if (r.status === 429) return undefined;           // rate limited: keep what we have
  if (!r.ok) return undefined;
  const j = await r.json();
  if (!j || !j.item) return null;
  const it = j.item;
  const isTrack = it.type === "track";
  const imgs = (isTrack ? it.album : it.show || {}).images || it.images || [];
  return {
    id: it.id, title: it.name,
    artist: isTrack ? it.artists.map(a => a.name).join(", ") : ((it.show && it.show.name) || ""),
    album: isTrack ? it.album.name : "",
    year: isTrack ? (it.album.release_date || "").slice(0, 4) : "",
    dur: it.duration_ms, art: (imgs[0] || {}).url || "",
    progress: j.progress_ms || 0, playing: !!j.is_playing, isTrack

/* ---------- lyrics (LRCLIB, synced) ---------- */
const lyricCache = new Map();
function parseLRC(txt) {
  const out = [];
  for (const raw of txt.split("\n")) {
    const m = raw.match(/^\s*((?:\[\d+:\d+(?:\.\d+)?\])+)\s*(.*)$/);
    if (!m) continue;
    const text = m[2].trim();
    for (const tm of m[1].match(/\[(\d+):(\d+(?:\.\d+)?)\]/g)) {
      const mm = tm.match(/\[(\d+):(\d+(?:\.\d+)?)\]/);
      out.push({ t: (parseInt(mm[1], 10) * 60 + parseFloat(mm[2])) * 1000, text });
    }
  }

}

                    .replace(/\s*[\(\[]\s*(feat|ft|with)\.?[^\)\]]*[\)\]]/i, "").trim();
async function getLyrics(tr) {
  if (lyricCache.has(tr.id)) return lyricCache.get(tr.id);
  const first = tr.artist.split(",")[0].trim();
  let lines = null;
  const tries = [
    { track_name: clean(tr.title), artist_name: first, album_name: tr.album, duration: Math.round(tr.dur / 1000) },
    { track_name: clean(tr.title), artist_name: first, duration: Math.round(tr.dur / 1000) }
  ];
  for (const q of tries) {
    try {
      const r = await fetch("https://lrclib.net/api/get?" + new URLSearchParams(q));
      if (r.ok) { const j = await r.json(); if (j.syncedLyrics) { lines = parseLRC(j.syncedLyrics); break; } }
    } catch (e) {}
  }
  if (!lines || !lines.length) {
    try {
      const r = await fetch("https://lrclib.net/api/search?" + new URLSearchParams({ track_name: clean(tr.title), artist_name: first }));
      if (r.ok) {
        const arr = (await r.json()).filter(x => x.syncedLyrics);
        arr.sort((a, b) => Math.abs(a.duration * 1000 - tr.dur) - Math.abs(b.duration * 1000 - tr.dur));
        if (arr[0] && Math.abs(arr[0].duration * 1000 - tr.dur) < 6000) lines = parseLRC(arr[0].syncedLyrics);
      }
    } catch (e) {}
  }
  if (lines && lines.length) lines = lines.map(l => ({ t: l.t, text: l.text || "♪" }));
  else lines = null;
  lyricCache.set(tr.id, lines);
  if (lyricCache.size > 60) lyricCache.delete(lyricCache.keys().next().value);
  return lines;
}

/* ---------- UI state ---------- */

function showReady() { document.body.classList.add("ready"); }

/* album colors: find the cover's strongest color and use it for the bars and progress bar (lyrics stay white) */

      try {

        const x = c.getContext("2d"); x.drawImage(im, 0, 0, 32, 32);
        const px = x.getImageData(0, 0, 32, 32).data;

        for (let i = 0; i < px.length; i += 4) {

          const bn = bins[Math.floor(h / 30) % 12]; bn.w += w; bn.h += h * w; bn.s += s * w;

}
function setColors(tr) {

  if (!tr.art) return applyColor(null);
  pickColor(tr.art).then(c => { if (S.track && S.track.id === tr.id) applyColor(c); });
}
const artCss = tr => tr.artCss || (tr.art ? 'url("' + tr.art + '")' : "");
/* record swap: old record rolls off to the left, the new one rolls back in */
let firstRecord = true, swapId = 0;
function swapRecord() {
  const deck = $("deck"), tr = S.track;
  const put = () => { if (!S.track) return; els.art.style.backgroundImage = artCss(S.track); setColors(S.track); };
  if (firstRecord || !deck.animate) { firstRecord = false; put(); return; }
  const my = ++swapId;
  const off = "translateX(-125%) rotate(-150deg)";
  const out = deck.animate([{ transform: "none", opacity: 1 }, { transform: off, opacity: 0 }],
    { duration: 450, easing: "cubic-bezier(.5,0,.9,.4)", fill: "forwards" });
  const pre = tr.art ? new Promise(res => { const im = new Image(); im.onload = im.onerror = res; im.src = tr.art; setTimeout(res, 2000); }) : Promise.resolve();
  Promise.all([out.finished.catch(() => {}), pre]).then(() => {
    if (my !== swapId) return;
    put();
    const inn = deck.animate([{ transform: off, opacity: 0 }, { transform: "none", opacity: 1 }],
      { duration: 700, easing: "cubic-bezier(.15,.75,.25,1)", fill: "forwards" });
    inn.finished.then(() => { if (my === swapId) deck.getAnimations().forEach(a => a.cancel()); }).catch(() => {});
  });

$("deck").addEventListener("click", togglePlay);

function applyTrack(tr) {
  const changed = !S.track || !tr || S.track.id !== tr.id;
  S.track = tr;
  if (!tr) {
    els.title.textContent = "Nothing playing"; els.artist.innerHTML = "&nbsp;";
    els.art.style.backgroundImage = ""; S.lines = null; S.lyricsFor = null; renderLyrics(null);
    document.body.classList.remove("nolyr"); els.lyrics.innerHTML = ""; return;
  }
  if (changed) {
    els.title.textContent = tr.title; els.artist.textContent = tr.artist + (tr.year ? " · " + tr.year : "");
    swapRecord();
    S.offset = 0; wakeNudge(20000);
    S.lines = null; S.lyricsFor = tr.id;
    renderLyrics(null); els.lyrics.innerHTML = "";
    document.body.classList.remove("nolyr");
    if (tr.isTrack) getLyrics(tr).then(lines => {

let nudgeTimer = 0;

function pos() { return S.base + (S.playing ? performance.now() - S.stamp : 0); }
function setPos(progress, playing) {
  const cur = pos();
  if (!S.playing !== !playing || Math.abs(cur - progress) > 450) { S.base = progress; S.stamp = performance.now(); }
  else if (!playing) { S.base = progress; S.stamp = performance.now(); }
  S.playing = playing;
  if (!playing) { S.base = progress; S.stamp = performance.now(); }

function updateLyricPos(ms) {
  const lines = S.lines; if (!lines) return;
  const t = ms + S.offset + 150;          // tiny lead so the line lights as it's sung
  let lo = 0, hi = lines.length - 1, idx = -1;
  while (lo <= hi) { const mid = (lo + hi) >> 1; if (lines[mid].t <= t) { idx = mid; lo = mid + 1; } else hi = mid - 1; }
  if (idx === S.active) return;

  if (S.active >= 0 && kids[S.active]) kids[S.active].className = "ln past";
  for (let i = Math.max(0, S.active + 1); i < idx; i++) if (kids[i]) kids[i].className = "ln past";
  if (idx < S.active) for (let i = Math.max(idx + 1, 0); i <= S.active; i++) if (kids[i]) kids[i].className = "ln";
  S.active = idx;

/* ---------- groove engine (the bars) ---------- */
/* A made-up drummer on a 16th-note grid. Each song gets its own tempo, swing and kick style.
   Every 8 bars the "section" changes (groove, breakdown, build-up, drop), with fills every 4th bar,

const peaks = [{ c: .3, t: .3, a: 0, ta: 0 }, { c: .7, t: .7, a: 0, ta: 0 }];

function seedSong(id) {

  const bpm = 84 + h % 45;                         // 84–128 bpm, fixed per song
  stepDur = 60 / bpm / 4;

async function poll() {

(async function boot() {

    if (!r.ok) throw new Error(r.status);
    const j = await r.json(), c = j.current;
    lastWx = at; wxAt = Date.now();
    const H = j.hourly;
    hourly = H.time.map((t, i) => ({ t: new Date(t * 1000), temp: H.temperature_2m[i], feels: H.apparent_temperature[i],
      hum: H.relative_humidity_2m[i], wind: H.wind_speed_10m[i], dir: H.wind_direction_10m[i], day: H.is_day[i],
      code: H.weather_code[i], pop: H.precipitation_probability[i] || 0, mm: H.precipitation[i] || 0 }));
    live = { temp: c.temperature_2m, feels: c.apparent_temperature, hum: c.relative_humidity_2m, wind: c.wind_speed_10m,
      dir: c.wind_direction_10m, day: c.is_day, code: c.weather_code };
    days = j.daily.time.map((t, i) => ({ t: new Date(t * 1000), hi: j.daily.temperature_2m_max[i], lo: j.daily.temperature_2m_min[i] }));
    renderWx();
    rainLine = rainText(c);
    drawAlerts();
  } catch (e) { $("cond").textContent = "Weather needs internet"; }
  finally { wxBusy = false; }
}
let rainLine = null, warnings = [];
function rainText(c) {
  const rainyNow = c.precipitation > 0 || (c.weather_code >= 51 && c.weather_code <= 99 && c.weather_code !== 71);
  if (rainyNow) return { cls: "rain", text: "Raining now" };
  const now = Date.now();
  for (const h of hourly) {
    if (h.t.getTime() <= now - 30 * MIN || h.t.getTime() > now + 12 * 60 * MIN) continue;
    if (h.pop >= 50 || h.mm >= 0.02) return { cls: "rain", text: "Rain likely around " + hm(h.t).replace(":00", "") + " (" + h.pop + "%)" };
  }
  return { cls: "", text: "No rain in the next 12 hours" };
}

/* ---------- warnings (National Weather Service) ---------- */
function drawWarnings() {
  if (!mapReady) return;
  const feats = warnings.filter(f => f.geometry).map(f => ({ type: "Feature", geometry: f.geometry,
    properties: { color: /Warning/.test(f.properties.event) ? "#ff5a4a" : "#ffb347" } }));
  map.getSource("warn").setData({ type: "FeatureCollection", features: feats });
}
async function refreshWarnings() {
  try {
    const r = await fetch("https://api.weather.gov/alerts/active?point=" + me[0].toFixed(3) + "," + me[1].toFixed(3),
      { headers: { Accept: "application/geo+json" } });
    if (!r.ok) throw new Error(r.status);
    const j = await r.json();
    warnings = (j.features || []).filter(f => /Warning|Watch|Advisory/.test(f.properties.event)).slice(0, 3);
    drawWarnings(); drawAlerts();
  } catch (e) { /* keep the last ones */ }
}
function drawAlerts() {
  const box = $("alerts"); box.innerHTML = "";
  const add = (cls, text) => { const d = document.createElement("div"); d.className = "al " + cls; d.innerHTML = "<i></i><span></span>"; d.lastChild.textContent = text; box.appendChild(d); };
  for (const w of warnings) {
    const end = w.properties.ends || w.properties.expires;
    add("warn", w.properties.event + (end ? " until " + hm(new Date(end)) : ""));
  }
  if (rainLine) add(rainLine.cls, rainLine.text);
  if (!box.children.length) add("", "Checking for rain…");
}

/* ---------- keeping it fresh ---------- */
async function refreshRadarTimes() {
  try {
    const [a, b] = await Promise.all([
      fetch(MESO + "/data/gis/images/4326/USCOMP/n0q_0.json?b=" + Date.now()).then(r => r.json()),
      fetch(MESO + "/data/gis/images/4326/hrrr/refd_0000.json?b=" + Date.now()).then(r => r.json())]);
    radarValid = new Date(a.meta.valid); hrrrInit = new Date(b.model_init_utc);
  } catch (e) { /* keep going with the clock */ }
  const nb = Math.floor(Date.now() / (5 * MIN));
  if (!mapReady) { bucket = nb; return; }
  if (nb !== bucket) { bucket = nb; const keepNow = cur === nowIdx; clearLayers(); buildFrames(); if (keepNow) cur = nowIdx; showFrame(cur); }
  else { buildFrames(); showFrame(cur); }
}
let lastAll = 0;
function refreshAll() {
  if (Date.now() - lastAll < 60000) return; lastAll = Date.now();
  refreshRadarTimes(); refreshWarnings();
  if (Date.now() - wxAt > 10 * MIN) refreshWeather();
}
setInterval(() => { if (open && !document.hidden) { lastAll = 0; refreshAll(); } }, 5 * MIN);
document.addEventListener("visibilitychange", () => { if (open && !document.hidden) refreshAll(); });
refreshWeather();                                            // so the page is ready the moment you swipe

if (params.has("radar")) setPage(true);
})();
</script>
